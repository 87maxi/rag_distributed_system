services:
  rag_qdrant:
    image: qdrant/qdrant:gpu-nvidia-latest
    container_name: rag_qdrant
    ports:
      - 6333:6333
      - 6334:6334
    environment:
      - QDRANT__GPU__INDEXING=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "1" ]
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "bash", "-c", "</dev/tcp/localhost/6333" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks: [ "rag_network" ]

  rag_phoenix:
    image: arizephoenix/phoenix:nightly
    container_name: rag_phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    environment:
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_GRPC_HOST=0.0.0.0
    healthcheck:
      test: [ "CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 6006))" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/phoenix:/root/.phoenix
    networks: [ "rag_network" ]

  rag-indexer:
    build: ./indexer
    container_name: rag_indexer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:12434
      - LLM_API_TYPE=openai
      - PHOENIX_ENDPOINT=http://rag_phoenix:6006/v1/traces
    command: python3 -u indexer.py
    volumes:
      - /home/maxi/Documentos/source/codecrypto/practice:/app/code
    depends_on:
      rag_qdrant:
        condition: service_healthy
      rag_phoenix:
        condition: service_healthy
    networks: [ "rag_network" ]

  rag-mcp-server:
    build: ./mcp-bridge
    container_name: rag-mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:12434
      - LLM_API_TYPE=openai
      - QDRANT_HOST=rag_qdrant
      - PHOENIX_ENDPOINT=http://rag_phoenix:6006/v1/traces
      - PROJECT_ROOT=/app/code
    command: python3 -u main.py
    volumes:
      - /home/maxi/Documentos/source/codecrypto/practice:/app/code
      - ./mcp-bridge:/app/mcp-bridge
    depends_on:
      rag_qdrant:
        condition: service_healthy
      rag_phoenix:
        condition: service_healthy
    ports:
      - 8002:8002
    networks: [ "rag_network" ]

networks:
  rag_network:
    driver: bridge
