services:
  qdrant:
    # 1. Cambiamos a la imagen con soporte para CUDA
    image: qdrant/qdrant:gpu-nvidia-latest 
    container_name: rag_qdrant
    ports: 
      - 6333:6333
      - 6334:6334 # Recomendado exponer gRPC para mejor rendimiento
    environment:
      # CRUCIAL: Debes activar explícitamente el motor de GPU en la configuración
      - QDRANT__GPU__INDEXING=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "sh", "-c", "</dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: 
      - ./data/qdrant:/qdrant/storage
    networks: ["rag_network"]

  rag_phoenix:
    image: arizephoenix/phoenix:nightly
    container_name: rag_phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 6006))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: ["rag_network"]

  ollama:
    build: ./ollama-local
    restart: unless-stopped
    container_name: rag_ollama
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ['1'], capabilities: [gpu]}]
    ports: 
      - 11434:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s 
    networks: ["rag_network"]
    
  rag-indexer:
    build: ./indexer
    container_name: rag_indexer
    command: python3 -u indexer.py
    volumes:
      - /home/maxi/Documentos/source/codecrypto:/app/code
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
      rag_phoenix:
        condition: service_healthy
    networks: ["rag_network"]

  rag-mcp-server:
    build: ./mcp-bridge
    container_name: rag_mcp
    command: python3 -u main.py
    depends_on:
      - qdrant
    networks: ["rag_network"]

networks:
  rag_network:
    driver: bridge