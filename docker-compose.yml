services:
  rag_qdrant:
    # 1. Cambiamos a la imagen con soporte para CUDA
    image: qdrant/qdrant:gpu-nvidia-latest
    container_name: rag_qdrant
    ports:
      - 6333:6333
      - 6334:6334 # Recomendado exponer gRPC para mejor rendimiento
    environment:
      # CRUCIAL: Debes activar explícitamente el motor de GPU en la configuración
      - QDRANT__GPU__INDEXING=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks: ["rag_network"]

  rag_phoenix:
    image: arizephoenix/phoenix:nightly
    container_name: rag_phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    environment:
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_GRPC_HOST=0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket; s = socket.socket(); s.connect(('localhost', 6006))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/phoenix:/root/.phoenix
    networks: ["rag_network"]

  rag_ollama:
    build: ./ollama-local
    restart: unless-stopped
    container_name: rag_ollama
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["1"], capabilities: [gpu] }]
    ports:
      - 11434:11434
    volumes:
      - ./data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: ["rag_network"]

  rag-indexer:
    build: ./indexer
    container_name: rag_indexer
    environment:
      - OLLAMA_HOST=http://rag_ollama:11434
    command: python3 -u indexer.py
    volumes:
      - /home/maxi/Documentos/source/codecrypto/practice:/app/code
    depends_on:
      rag_ollama:
        condition: service_healthy
      rag_qdrant:
        condition: service_healthy
      rag_phoenix:
        condition: service_healthy
    networks: ["rag_network"]

  rag-mcp-server:
    build: ./mcp-bridge
    container_name: rag-mcp
    environment:
      - OLLAMA_HOST=http://rag_ollama:11434 # <--- ESTO ES LO QUE FALTA
      - QDRANT_HOST=rag_qdrant # <--- TAMBIÉN AJUSTA ESTO SI ES NECESARIO
      - PHOENIX_ENDPOINT=http://rag_phoenix:6006/v1/traces
      #- PHOENIX_API_KEY=
      - PROJECT_ROOT=/app/code
    command: python3 -u main.py
    volumes:
      - /home/maxi/Documentos/source/codecrypto/practice:/app/code
      - ./mcp-bridge:/app/mcp-bridge
    depends_on:
      rag_qdrant:
        condition: service_healthy
      rag_ollama:
        condition: service_healthy
      rag_phoenix:
        condition: service_healthy
    ports:
      - 8002:8002
    networks: ["rag_network"]

networks:
  rag_network:
    driver: bridge
