# Configuración optimizada para cache RAG
port 6379
bind 0.0.0.0

# Persistencia (opcional)
save 900 1
save 300 10
save 60 10000

# Memoria (2GB máximo)
maxmemory 2gb
maxmemory-policy allkeys-lru

# Rendimiento
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Seguridad (si usas password)
# requirepass tu_password_seguro